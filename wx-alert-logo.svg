<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WX Alert Service">
  <!-- Palette: ink #2F3842 · storm grey #4A5561 · rain grey #9AA3AB · veil #DCE0E3 · off-white #F4F3EF · vermillion #E8502E -->

  <!-- Card background (keeps the mark legible on both light and dark GitHub themes) -->
  <rect x="16" y="16" width="968" height="268" rx="28" fill="#F4F3EF" stroke="#DCE0E3" stroke-width="2"/>

  <!-- Emblem: storm-grey disc -->
  <circle cx="160" cy="150" r="110" fill="#4A5561"/>

  <!-- Vermillion sweep arc along the top-right rim -->
  <path d="M 105 55 A 110 110 0 0 1 270 150" fill="none" stroke="#E8502E" stroke-width="15" stroke-linecap="round"/>

  <!-- Top-down aircraft silhouette -->
  <path d="M 160 60 L 166 78 L 168 120 L 252 168 L 252 176 L 168 152 L 166 205 L 195 224 L 195 230 L 166 218 L 160 238 L 154 218 L 125 230 L 125 224 L 154 205 L 152 152 L 68 176 L 68 168 L 152 120 L 154 78 Z"
        fill="#F4F3EF"/>

  <!-- Wordmark -->
  <text x="330" y="158" font-family="'Albert Sans','Segoe UI',Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="-1" fill="#2F3842">WX Alert</text>

  <!-- Subtitle: vermillion square + SERVICE -->
  <rect x="332" y="186" width="26" height="26" fill="#E8502E"/>
  <text x="372" y="208" font-family="'Albert Sans','Segoe UI',Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="8" fill="#9AA3AB">SERVICE</text>
</svg>
